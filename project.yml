# XcodeGen spec for the app host: `brew install xcodegen && xcodegen` writes
# Roostr.xcodeproj (gitignored). The app itself is Rust: Scripts/build-rust.sh
# builds `roostr-ios` from the sibling RoostrWebsite repository's GPUI
# workspace (../RoostrWebsite/gpui, or ROOSTR_GPUI_DIR) and App/main.c hands
# the process to it.
#
# Signing: automatic under the Roostr developer team (58GKGS43UM); edit here
# to build under another account.
name: Roostr
options:
  bundleIdPrefix: app.roostr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.1"
settings:
  base:
    DEVELOPMENT_TEAM: 58GKGS43UM
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "60"
targets:
  Roostr:
    type: application
    platform: iOS
    sources:
      - path: App/main.c
      - path: App/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
    preBuildScripts:
      - name: Build Rust (roostr-ios)
        script: '"$SRCROOT/Scripts/build-rust.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/rust/libroostr_ios.a
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Roostr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        # GPUI's UIKit platform runs one window scene with its own delegate
        # classes (gpui-pre-ios); UIKit may restore the scene by class name,
        # including the Swift app's SwiftUI delegate, which GPUI takes over.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: GPUIIosSceneDelegate
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # iPad multitasking requires every orientation.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # roostr://app/<web path> opens that page (roostr://app/app/object/<id>).
        CFBundleURLTypes:
          - CFBundleURLName: app.roostr.Roostr
            CFBundleURLSchemes: [roostr]
        # Export compliance is answered in App Store Connect (NIP-44 is standard
        # encryption); an ITSAppUsesNonExemptEncryption key would need the
        # compliance code that answer produces, so it is deliberately absent.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roostr.Roostr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        LIBRARY_SEARCH_PATHS: $(DERIVED_FILE_DIR)/rust
        # The Rust library's system dependencies (`cargo rustc -p roostr-ios
        # --crate-type staticlib -- --print native-static-libs`).
        OTHER_LDFLAGS:
          - -lroostr_ios
          - -liconv
          - -framework CoreFoundation
          - -framework CoreGraphics
          - -framework CoreText
          - -framework CoreVideo
          - -framework Foundation
          - -framework Metal
          - -framework Network
          - -framework QuartzCore
          - -framework SafariServices
          - -framework Security
          - -framework UIKit
          - -framework UserNotifications
        DEAD_CODE_STRIPPING: YES
schemes:
  Roostr:
    build:
      targets: { Roostr: all }
    run:
      config: Debug
