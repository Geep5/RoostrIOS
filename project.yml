# XcodeGen spec for the app shell: `brew install xcodegen && xcodegen` writes
# Roostr.xcodeproj (gitignored). The engine bridge is the local Swift package.
#
# Signing: automatic under the Roostr developer team (58GKGS43UM); edit here
# to build under another account.
name: Roostr
options:
  bundleIdPrefix: app.roostr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.1"
settings:
  base:
    DEVELOPMENT_TEAM: 58GKGS43UM
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RoostrIOS:
    path: .
targets:
  Roostr:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Web]
      # The website's static build (Scripts/build-web.sh), served by RoostrSchemeHandler as roostr://app/.
      - path: App/Web
        type: folder
        buildPhase: resources
    dependencies:
      - package: RoostrIOS
        product: RoostrUI
      - sdk: WebKit.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Roostr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # iPad multitasking requires every orientation.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Export compliance is answered in App Store Connect (NIP-44 is standard
        # encryption); an ITSAppUsesNonExemptEncryption key would need the
        # compliance code that answer produces, so it is deliberately absent.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roostr.Roostr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
