# XcodeGen spec for the app shell: `brew install xcodegen && xcodegen` writes
# Roostr.xcodeproj (gitignored). The engine bridge is the local Swift package.
#
# Signing: automatic, with the team taken from the ROOSTR_TEAM_ID environment
# variable when generating (`ROOSTR_TEAM_ID=ABCDE12345 xcodegen`). Without it
# the project still builds for the simulator; device/TestFlight builds need it.
name: Roostr
options:
  bundleIdPrefix: app.roostr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.1"
settings:
  base:
    DEVELOPMENT_TEAM: ${ROOSTR_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RoostrIOS:
    path: .
targets:
  Roostr:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Web]
      # The website's static build (Scripts/build-web.sh), served by RoostrSchemeHandler as roostr://app/.
      - path: App/Web
        type: folder
        buildPhase: resources
    dependencies:
      - package: RoostrIOS
        product: RoostrUI
      - sdk: WebKit.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Roostr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # NIP-44 (ChaCha20/HKDF/HMAC) is standard, non-proprietary encryption:
        # "uses encryption" is answered YES in App Store Connect with the
        # mass-market exemption; the annual self-classification report applies.
        ITSAppUsesNonExemptEncryption: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roostr.Roostr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
