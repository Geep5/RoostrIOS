# XcodeGen spec for the app shell: `brew install xcodegen && xcodegen` writes
# Roostr.xcodeproj (gitignored). The engine bridge is the local Swift package.
name: Roostr
options:
  bundleIdPrefix: app.roostr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.1"
packages:
  RoostrIOS:
    path: .
targets:
  Roostr:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Web]
      # The website's static build (Scripts/build-web.sh), served by RoostrSchemeHandler as roostr://app/.
      - path: App/Web
        type: folder
        buildPhase: resources
    dependencies:
      - package: RoostrIOS
        product: RoostrUI
      - sdk: WebKit.framework
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
